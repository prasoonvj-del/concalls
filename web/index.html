<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13201f">
<title>Market Desk</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">◆</span> Market Desk</div>
  <nav id="tabs">
    <a href="#today" data-tab="today">Today</a>
    <a href="#markets" data-tab="markets">Markets</a>
    <a href="#sectors" data-tab="sectors">Sectors</a>
    <a href="#companies" data-tab="companies">Companies</a>
    <a href="#concalls" data-tab="concalls">Concalls</a>
    <a href="#peers" data-tab="peers">Peers</a>
    <a href="#trackers" data-tab="trackers">Trackers</a>
    <a href="#mydesk" data-tab="mydesk" title="Watchlist, Search and Notes">★ My desk</a>
    <a href="#archive" data-tab="archive">Archive</a>
    <a href="#settings" data-tab="settings" title="Watchlist &amp; settings" aria-label="Settings">⚙</a>
  </nav>
</header>
<main id="view" aria-live="polite"><div class="loading">Loading…</div></main>
<button id="notebtn" class="notebtn" title="Add a note (select text first to quote it)">✎ Note</button>
<div id="notepanel" class="pop" hidden role="dialog" aria-modal="true"><div class="pop-card notecard">
  <h2>Add a note</h2><div class="m" id="nctx"></div><blockquote id="nquote" hidden></blockquote>
  <textarea id="ntext" rows="6" placeholder="Your thoughts - thesis, questions, things to check, levels to watch…"></textarea>
  <input type="text" id="nco" placeholder="Company (optional) - links the note to its company page">
  <div class="nbtns"><button class="primary" id="nsave">Save note</button> <button id="ncancel">Cancel</button></div></div></div>
<div id="pop" class="pop" hidden role="dialog" aria-modal="true"><div class="pop-card" id="pop-card"></div></div>
<div id="tip" class="tip" hidden></div>
<script src="data/index.js"></script>
<script src="app.js"></script>
</body>
</html>

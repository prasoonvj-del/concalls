[ai]
# Free Gemini key: https://aistudio.google.com/apikey  (Create API key -> copy -> paste below)
api_key = PASTE_YOUR_KEY_HERE

# Leave these two as they are for Gemini.
base_url = https://generativelanguage.googleapis.com/v1beta/openai
model = auto

# --- If Gemini gives trouble, any OpenAI-compatible service works. Examples:
# Groq (free, very fast):   base_url = https://api.groq.com/openai/v1
#                           model    = openai/gpt-oss-120b
# OpenRouter (free models): base_url = https://openrouter.ai/api/v1
#                           model    = (any model id ending in :free)

# Give up on a single reply after this many seconds
max_wait_seconds = 300
# Pause between summaries (keeps you inside the free per-minute limit)
seconds_between_calls = 5
# Longest transcript text sent (characters). Lower it if your provider complains about size.
max_transcript_chars = 250000

[backup]
# OPTIONAL second AI, used automatically when Gemini is busy or down.
# Groq is free (no card): sign up at https://console.groq.com -> API Keys -> Create.
# Paste the key below. Leave the other lines as they are.
api_key = PASTE_GROQ_KEY_HERE
base_url = https://api.groq.com/openai/v1
model = auto
# Groq's free tier takes ~8,000 tokens per minute, so long transcripts are read in parts
# (slower: ~3-4 minutes per company, but the run keeps going).
max_input_tokens = 5000
max_wait_seconds = 180

[news]
# Morning news brief (menu option 5, or: python news.py)
# Your feed list, exported from FeedFlow (Settings > Export). On the tablet, a newer
# feedflow-export*.opml in Download is picked up automatically.
opml = feeds.opml
# FeedFlow folders to leave out (not stock-market news)
skip_folders = Financial History
# Folders that get their own tab instead of going into the market brief ("Tab = folder, folder; ...")
tabs = Tech = Tech; Auto = Auto; Sports = Sports
# Extra searches from Google News (edit google_news.txt to change them)
google_news = yes
# Look-back window in hours
hours = 24
# Companies to pull to the top of the brief (comma-separated, any part of the name)
watchlist =
# Topics with fewer stories than this are listed without an AI write-up (saves quota)
min_stories_for_digest = 3

[cloud]
# Used by daily.py (GitHub Actions every morning, or run it yourself)
news = yes
concalls = yes
# Look-back for new transcripts on each run (the very first run looks back first_run_days)
concall_days = 7
first_run_days = 150
# "all", or a comma-separated list of sector names as shown on the website
concall_sectors = all
# New concall summaries per run (keeps inside the free AI limit; the rest roll to the next day)
max_concalls_per_run = 60
# Stop starting new concall summaries after this many minutes (the site then publishes promptly)
max_concall_minutes = 30
# all / watchlist / none - watchlist: only your watchlist companies get last quarter summarised first
compare_with_last_quarter = watchlist
# Companies to summarise first (comma-separated, part of a name is enough)
watchlist =

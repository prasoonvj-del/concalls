name: Daily update

on:
  # Three independent starters, so a missed timer never leaves the site stale:
  #  1. cron-job.org calls the "workflow_dispatch" address at 05:10, 07:10, 10:10, 14:10,
  #     16:10, 19:10, 22:10 IST with mode = full (05:10, 14:10) or news-only (the rest).
  #  2. A Claude scheduled task edits run-now.txt at the same times (push trigger).
  #  3. GitHub's own timer, 30 minutes later, as a last fallback.
  # Whichever arrives second is skipped if the site was updated less than 60 minutes ago.
  workflow_dispatch:
    inputs:
      mode:
        description: "full = news + concalls, news-only = news refresh"
        default: full
        type: choice
        options: [full, news-only]
      force:
        description: "Run even if the site was updated in the last hour"
        default: false
        type: boolean
  push:
    paths: ["run-now.txt"]
  schedule:
    # 30 min after each IST slot (times in UTC): 05:40, 07:40, 10:40, 14:40, 16:40, 19:40, 22:40 IST
    - cron: "10 0,2,5,9,11,14,17 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: run-now.txt
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EVENT="${{ github.event_name }}"
          MODE=full
          if [ "$EVENT" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}"; fi
          if [ "$EVENT" = "push" ] && grep -q "news-only" run-now.txt; then MODE=news-only; fi
          if [ "$EVENT" = "schedule" ]; then
            H=$(date -u +%H); if [ "$H" != "00" ] && [ "$H" != "09" ]; then MODE=news-only; fi
          fi
          GO=true
          if [ "${{ inputs.force }}" != "true" ]; then
            LAST=$(gh api repos/${{ github.repository }}/commits/data --jq .commit.committer.date 2>/dev/null || echo "")
            if [ -n "$LAST" ]; then
              AGE=$(( ($(date -u +%s) - $(date -u -d "$LAST" +%s)) / 60 ))
              echo "Site data last updated $AGE minutes ago"
              if [ "$AGE" -lt 60 ]; then GO=false; echo "Updated recently - skipping this start"; fi
            fi
          fi
          echo "Event=$EVENT mode=$MODE go=$GO"
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

  update:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore saved data (kept on the 'data' branch)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            rm -rf data summaries
            git archive FETCH_HEAD | tar -x
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Build news brief, concall summaries and website
        timeout-minutes: 75
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p data
          MODE=
          if [ "${{ needs.gate.outputs.mode }}" = "news-only" ]; then MODE=--news-only; fi
          python daily.py $MODE 2>&1 | tee data/last_run.log

      - name: Save data (one commit, replaced each run - the repository doesn't grow)
        if: always()
        run: |
          tmp=$(mktemp -d)
          cp -r data "$tmp/" 2>/dev/null || true
          cp -r summaries "$tmp/" 2>/dev/null || true
          rm -rf "$tmp/data/pdf" "$tmp/data/text"
          cd "$tmp"
          git init -q -b data
          git config user.name "market-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Data as of $(date -u '+%F %H:%M') UTC"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:data

      - name: Make sure the website is built (even if the step above failed or ran out of time)
        if: always()
        run: python site_builder.py --quiet --no-open

      - uses: actions/configure-pages@v5
        if: always()

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: public

      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4

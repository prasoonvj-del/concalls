name: Daily update

on:
  # Runs are started by a scheduled task on Claude that updates run-now.txt at
  # 05:10, 07:10, 10:10, 14:10, 16:10, 19:10, 22:10 IST - GitHub's own timer kept dropping runs.
  # "news-only" in run-now.txt = news refresh; anything else = full update (news + concalls).
  workflow_dispatch:         # "Run workflow" button for a manual refresh
  push:
    paths: ["run-now.txt"]   # editing this file also starts a run

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore saved data (kept on the 'data' branch)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            rm -rf data summaries
            git archive FETCH_HEAD | tar -x
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Build news brief, concall summaries and website
        timeout-minutes: 75
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p data
          MODE=
          if [ "${{ github.event_name }}" = "push" ] && grep -q "news-only" run-now.txt; then MODE=--news-only; fi
          python daily.py $MODE 2>&1 | tee data/last_run.log

      - name: Save data (one commit, replaced each run - the repository doesn't grow)
        if: always()
        run: |
          tmp=$(mktemp -d)
          cp -r data "$tmp/" 2>/dev/null || true
          cp -r summaries "$tmp/" 2>/dev/null || true
          rm -rf "$tmp/data/pdf" "$tmp/data/text"
          cd "$tmp"
          git init -q -b data
          git config user.name "market-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Data as of $(date -u '+%F %H:%M') UTC"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:data

      - name: Make sure the website is built (even if the step above failed or ran out of time)
        if: always()
        run: python site_builder.py --quiet --no-open

      - uses: actions/configure-pages@v5
        if: always()

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: public

      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4

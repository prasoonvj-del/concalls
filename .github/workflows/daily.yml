name: Daily update

on:
  schedule:   # times are UTC; GitHub may start a run 10-30 minutes late
    - cron: "40 23 * * *"            # 05:10 IST  full update (news + concalls)
    - cron: "40 13 * * *"            # 19:10 IST  full update (concalls filed during the day)
    - cron: "40 1,4,7,10,16 * * *"   # 07:10, 10:10, 13:10, 16:10, 22:10 IST  news refresh
  workflow_dispatch:         # "Run workflow" button for a manual refresh
  push:
    paths: ["run-now.txt"]   # editing this file also starts a run

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Build news brief, concall summaries and website
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p data
          if [ "${{ github.event.schedule }}" = "40 1,4,7,10,16 * * *" ]; then MODE=--news-only; else MODE=; fi
          python daily.py $MODE 2>&1 | tee data/last_run.log

      - name: Save today's data in the repository
        if: always()
        run: |
          git config user.name "market-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git pull --rebase --autostash || true
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4

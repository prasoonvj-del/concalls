name: Model comparison (one-off test)

# Started by hand. Summarises a few recent concalls with free OpenRouter / NVIDIA models using the site's own prompt,
# next to what Gemini's full model already wrote. Changes nothing on the site; results are a downloadable artifact.
on:
  workflow_dispatch:
    inputs:
      calls:
        description: "How many concalls to test"
        default: "5"
      models:
        description: "Model ids to test, comma-separated (blank = pick automatically)"
        default: ""

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - name: Restore saved data (read-only copy)
        run: |
          git fetch --depth 1 origin data
          rm -rf data summaries
          git archive FETCH_HEAD | tar -x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          N_CALLS: ${{ inputs.calls || '4' }}
          MODELS: ${{ inputs.models || 'nvidia/nemotron-3-ultra-550b-a55b:free,nvidia/nemotron-3-ultra-550b-a55b,moonshotai/kimi-k3.1-pro,z-ai/glm-5.3-flash,mistralai/mistral-large-4-1t-a52b' }}
          MAX_WAIT: "420"
          PYTHONUNBUFFERED: "1"
        run: python tools/compare_models.py
      - name: Keep the results on the 'compare' branch (readable without downloads)
        if: always()
        run: |
          cd compare
          git init -q -b compare
          git config user.name "market-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Model comparison $(date -u '+%F %H:%M') UTC"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:compare

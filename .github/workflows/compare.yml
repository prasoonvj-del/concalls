name: Model comparison (one-off test)

# Started by hand. Summarises a few recent concalls with free OpenRouter / NVIDIA models using the site's own prompt,
# next to what Gemini's full model already wrote. Changes nothing on the site; results are a downloadable artifact.
on:
  workflow_dispatch:
    inputs:
      calls:
        description: "How many concalls to test"
        default: "5"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restore saved data (read-only copy)
        run: |
          git fetch --depth 1 origin data
          rm -rf data summaries
          git archive FETCH_HEAD | tar -x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compare
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          N_CALLS: ${{ inputs.calls }}
          PYTHONUNBUFFERED: "1"
        run: python tools/compare_models.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-compare
          path: compare/

name: Setup research (by hand)

# Started by hand. Two years of breakouts / retests among Market Desk companies, with the conditions on the day and the
# price path after, to find what raises the win rate. Changes nothing on the site; results go to the research branch.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First signal day (YYYY-MM-DD)"
        default: "2026-11-03"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restore saved data (read-only copy)
        run: |
          git fetch --depth 1 origin data
          rm -rf data summaries
          git archive FETCH_HEAD | tar -x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt yfinance
      - name: Back-test
        env:
          START: ${{ inputs.start || '2026-11-03' }}
          PYTHONUNBUFFERED: "1"
        run: python tools/research_setups.py
      - name: Keep the results on the 'research' branch
        if: always()
        run: |
          mkdir -p research && cd research
          git init -q -b research
          git config user.name "market-desk-bot"
          git config user.email "market-desk-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Research $(date -u +%F)" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research:research

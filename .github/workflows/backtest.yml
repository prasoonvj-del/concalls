name: Breakout back-test (by hand)

# Started by hand. Replays TradeCharts' breakout + news grading over the last few weeks on real prices (Yahoo) and
# Market Desk's news as it stood each day. Changes nothing on the site; results go to the 'backtest' branch.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First signal day (YYYY-MM-DD)"
        default: "2026-11-03"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore saved data (read-only copy)
        run: |
          git fetch --depth 1 origin data
          rm -rf data summaries
          git archive FETCH_HEAD | tar -x
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt yfinance
      - name: Back-test
        env:
          START: ${{ inputs.start || '2026-11-03' }}
          PYTHONUNBUFFERED: "1"
        run: python tools/backtest_breakouts.py
      - name: Keep the results on the 'backtest' branch
        if: always()
        run: |
          mkdir -p backtest && cd backtest
          git init -q -b backtest
          git config user.name "market-desk-bot"
          git config user.email "market-desk-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Back-test $(date -u +%F)" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" backtest:backtest
